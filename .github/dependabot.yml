version: 2
updates:
  # Keep GitHub Actions versions current
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - github-actions

  # Backend pip dependencies
  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - backend
    groups:
      # Batch all minor and patch bumps into a single PR instead of one-per-package.
      # After merging, regenerate backend/requirements.txt:
      #   uv pip compile --python-version 3.11 backend/requirements.in \
      #       -o backend/requirements.txt
      backend-minor-patch:
        update-types:
          - minor
          - patch
    ignore:
      # Do not auto-PR major-version bumps; they require manual review and lock regen.
      - dependency-name: "*"
        update-types:
          - version-update:semver-major

  # Frontend / root pip dependencies
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - frontend
    groups:
      # After merging, regenerate requirements.txt:
      #   uv pip compile requirements.in -o requirements.txt
      frontend-minor-patch:
        update-types:
          - minor
          - patch
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major
