name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            requirements-dev.txt

      # Install the runtime lock first (matches the production image),
      # then the dev lock (adds pytest and its transitives).
      # This is the clean-environment validation of the T1.4 dependency pins.
      - name: Install runtime dependencies
        run: pip install -r backend/requirements.txt

      - name: Install dev dependencies
        run: pip install -r requirements-dev.txt

      # Offline pytest only.  make eval / make eval-corpus are NOT run:
      # they require live Pinecone credentials and incur index query cost.
      - name: Run tests
        run: pytest tests/ -v
