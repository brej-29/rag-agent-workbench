name: Model check

# Weekly live check that every configured chat model still exists and is not
# announced for shutdown.  Groq retired the original default model on
# 2026-08-16 and nothing noticed; this job exists so that never happens again.
on:
  schedule:
    - cron: "17 6 * * 1"   # Mondays 06:17 UTC
  workflow_dispatch:

jobs:
  models:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install runtime dependencies
        run: pip install --require-hashes -r backend/requirements.txt

      - name: Check configured models
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          PINECONE_API_KEY: unused
          PINECONE_INDEX_NAME: unused
          PINECONE_HOST: https://unused.invalid
        run: python scripts/check_models.py
