name: Landing site

# Builds site/ (stdlib Python, no installs) and publishes it to GitHub Pages.
# The deploy job is skipped until Pages is switched on: set Settings > Pages > Source to
# "GitHub Actions", then add the repository variable PAGES_ENABLED = true (README, "Landing site").
on:
  push:
    branches: [main]
    paths:
      - site/**
      - eval/results/timeline.json
      - backend/app/data/regs/regs-v1.jsonl
      - frontend/services/presenters.py
      - frontend/services/home_html.py
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Build the site
        run: python site/build.py
        env:
          SITE_URL: ${{ vars.SITE_URL || 'https://brej-29.github.io/rag-agent-workbench' }}
          GOOGLE_SITE_VERIFICATION: ${{ vars.GOOGLE_SITE_VERIFICATION }}
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site/dist

  deploy:
    if: vars.PAGES_ENABLED == 'true'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
