chartCategoricalColors = ["#1C8466", "#5B5FCF", "#B8457E"]

[theme.light.sidebar]
backgroundColor = "#E8EDE7"

[theme.dark]
primaryColor = "#6DB89E"
backgroundColor = "#11161B"
secondaryBackgroundColor = "#1A2229"
textColor = "#E4EAE5"
borderColor = "#2C3740"
linkColor = "#6DB89E"
codeTextColor = "#6DB89E"
codeBackgroundColor = "#1A2229"
greenColor = "#6DB89E"
orangeColor = "#E8913F"
