[client]
toolbarMode = "minimal"

[theme]
font = "IBM Plex Sans:https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap"
headingFont = "Bricolage Grotesque:https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&display=swap"
codeFont = "Martian Mono:https://fonts.googleapis.com/css2?family=Martian+Mono:wght@400;500&display=swap"
headingFontWeights = [800, 700, 700, 600, 600, 600]
baseRadius = "0.4rem"
