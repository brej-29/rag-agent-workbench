# When each provision starts to apply. Hand-reviewed; every dated rule cites the provision that
# sets the date (`basis`) and a verbatim `quote` from it. tests/corpus/test_registry_corpus.py
# fails if a quote is not found in the built corpus, so a wrong date cannot be committed.
#
# Matching: `prefix` selects the instrument; `kinds` filters; chapters / sections / articles /
# paragraphs are alternatives; exclusions win. Later rules override earlier ones.
# Dates: `from` (ISO date) and optional `condition` (caller-supplied, e.g. the AI system's class).

# ---------------------------------------------------------------- EU AI Act (consolidated 27.7.2026)
- id: ai-act-general
  match: {prefix: eu-ai-act, kinds: [article, article_paragraph]}
  dates: [{from: 2026-08-02}]
  basis: eu-ai-act/art-113
  quote: "It shall apply from 2 August 2026."

- id: ai-act-chapters-1-2
  match: {prefix: eu-ai-act, kinds: [article, article_paragraph], chapters: [I, II]}
  dates: [{from: 2025-02-02}]
  basis: eu-ai-act/art-113
  quote: "(a) Chapters I and II shall apply from 2 February 2025"

- id: ai-act-new-prohibitions
  match: {prefix: eu-ai-act, paragraphs: ["5(1a)", "5(1b)"]}
  dates: [{from: 2026-12-02}]
  basis: eu-ai-act/art-113
  quote: "Article 5(1a) and (1b) which shall apply from 2 December 2026"
  note: "Article 5(1), first subparagraph, points (ba) and (bb) also apply from 2026-12-02; the rest of Article 5(1) applies from 2025-02-02"

- id: ai-act-gpai-governance
  match: {prefix: eu-ai-act, kinds: [article, article_paragraph], sections: [III.4], chapters: [V, VII, XII], articles: [78], exclude_articles: [101]}
  dates: [{from: 2025-08-02}]
  basis: eu-ai-act/art-113
  quote: "(b) Chapter III Section 4, Chapter V, Chapter VII and Chapter XII and Article 78 shall apply from 2 August 2025, with the exception of Article 101"

- id: ai-act-high-risk
  match: {prefix: eu-ai-act, kinds: [article, article_paragraph], sections: [III.1, III.2, III.3], exclude_paragraphs: ["6(5)"]}
  dates:
    - {from: 2027-12-02, condition: annex_iii}
    - {from: 2028-08-02, condition: annex_i}
  basis: eu-ai-act/art-113
  quote: "(i) 2 December 2027 as regards AI systems classified as high-risk pursuant to Article 6(2) and Annex III; and (ii) 2 August 2028 as regards AI systems classified as high-risk pursuant to Article 6(1) and Annex I"

- id: ai-act-articles-102-110
  match: {prefix: eu-ai-act, articles: [102, 103, 104, 105, 106, 107, 108, 109, 110]}
  dates: [{from: 2026-07-27}]
  basis: eu-ai-act/art-113
  quote: "(d) Articles 102 to 110 shall apply from 27 July 2026."

- id: ai-act-recitals-annexes
  match: {prefix: eu-ai-act, kinds: [recital, annex, annex_point]}
  dates: [{}]
  basis: eu-ai-act/art-113
  note: "no date of its own: recitals guide interpretation; annexes apply through the articles that reference them"

